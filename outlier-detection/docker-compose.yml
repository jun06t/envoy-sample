services:
  envoy:
    build:
      context: ./frontend/
    volumes:
      - ./frontend/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on:
      - backend1
      - backend2

  backend1:
    build:
      context: ./backend/
    ports:
      - "8081:8080"
    environment:
      - INSTANCE_NAME=backend1
      - ERROR_RATE=0

  backend2:
    build:
      context: ./backend/
    ports:
      - "8082:8080"
    environment:
      - INSTANCE_NAME=backend2
      - ERROR_RATE=0

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - envoy

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
